<header class="header">
  <a class="wordmark" [href]="'/' + lang()">bytek<span class="bit" aria-hidden="true"></span></a>

  <nav class="nav" [attr.aria-label]="t().footer.navLabel">
    @for (section of sections; track section.fragment) {
      <a [href]="anchor(section.fragment)">{{ t().nav[section.label] }}</a>
    }
  </nav>

  <div class="actions">
    <div class="lang" role="group" [attr.aria-label]="t().nav.langLabel">
      <button
        type="button"
        [class.active]="lang() === 'es'"
        [attr.aria-pressed]="lang() === 'es'"
        (click)="setLang('es')"
      >
        ES
      </button>
      <span class="lang-divider" aria-hidden="true">/</span>
      <button
        type="button"
        [class.active]="lang() === 'en'"
        [attr.aria-pressed]="lang() === 'en'"
        (click)="setLang('en')"
      >
        EN
      </button>
    </div>

    <button
      type="button"
      class="theme-toggle"
      [attr.aria-label]="themeActionLabel()"
      [title]="themeActionLabel()"
      (click)="toggleTheme()"
    >
      @if (theme() === 'dark') {
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4.4" />
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1" />
        </svg>
      } @else {
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z" />
        </svg>
      }
    </button>

    <button
      type="button"
      class="menu-toggle"
      aria-controls="header-menu"
      [attr.aria-expanded]="isMenuOpen()"
      [attr.aria-label]="isMenuOpen() ? t().nav.menuClose : t().nav.menuOpen"
      (click)="toggleMenu()"
    >
      <span class="menu-icon" [class.open]="isMenuOpen()" aria-hidden="true"></span>
    </button>
  </div>
</header>

<!--
  El menú vive siempre en el DOM para poder animar también el cierre: cerrado
  mide cero y queda oculto a la vista y al teclado, no borrado.
-->
<nav
  id="header-menu"
  class="menu"
  [class.open]="isMenuOpen()"
  [attr.aria-label]="t().footer.navLabel"
>
  <div class="menu-viewport">
    <div class="menu-links">
      @for (section of sections; track section.fragment) {
        <a [href]="anchor(section.fragment)" (click)="closeMenu()">{{ t().nav[section.label] }}</a>
      }
    </div>
  </div>
</nav>
